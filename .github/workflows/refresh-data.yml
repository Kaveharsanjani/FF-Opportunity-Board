name: Refresh Vacancy Board data

on:
  schedule:
    # Tuesdays and Fridays at 13:00 UTC (adjust as you like)
    - cron: '0 13 * * 2,5'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Rebuild data.json
        run: python build_data.py

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "vacancy-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh data.json ($(date -u +%Y-%m-%d))"
          git push
